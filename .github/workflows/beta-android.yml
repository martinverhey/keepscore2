name: Beta (Android)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
      - run: flutter pub get
        working-directory: .
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
          working-directory: android
      - name: Resolve version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "BUILD_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Write keystore and Play credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          printf '%s' "$PLAY_STORE_JSON_KEY" > play-store-key.json
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties
          python3 -c "import json; json.load(open('play-store-key.json'))"
      - name: Build and upload to Play internal testing
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/android/play-store-key.json
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane android beta

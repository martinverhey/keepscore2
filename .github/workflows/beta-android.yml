name: Beta release (Android)

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.9"
          channel: stable
      - run: flutter pub get
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: android
      - name: Resolve version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "BUILD_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Write keystore and Play credentials
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=../upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "${{ secrets.PLAY_STORE_JSON_KEY }}" > play-store-key.json
      - name: Build and upload to Play internal testing
        env:
          PLAY_STORE_JSON_KEY_PATH: ${{ github.workspace }}/android/play-store-key.json
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane android beta

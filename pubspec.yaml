name: keepscore2
description: "Create your own competition ladder — create matches, get an Elo leaderboard."
publish_to: 'none'
version: 0.2.1

environment:
  sdk: ^3.10.7

dependencies:
  bloc: ^9.2.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  get_it: ^9.2.1
  go_router: ^17.4.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  liquid_glass_easy: ^4.2.0
  package_info_plus: ^10.2.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  sign_in_with_apple: ^8.1.0
  supabase_flutter: ^2.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: assets/icon/app_icon_background.png
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#BC4D08"
    theme_color: "#BC4D08"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/.env
  fonts:
    - family: Permanent Marker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf
